<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSA Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
body { font-family: Inter, sans-serif; }
.arrow { transition: transform .25s ease; }
</style>
<script>
  tailwind.config = {
    darkMode: 'class',
  }
</script>
</head>

<body class="bg-white text-black dark:bg-[#0f0f0f] dark:text-white p-6">


<header class="text-center mb-10 mt-4">
  <h1 class="text-4xl font-semibold tracking-tight text-gray-900 dark:text-gray-100">
    DSA Tracker
  </h1>
  <p class="text-gray-600 dark:text-gray-400 mt-1">Monitor LeetCode activity</p>

  <div id="auth-info"
       class="mt-2 inline-flex items-center gap-2 px-3 py-1.5 text-xs text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 rounded-full bg-white dark:bg-black shadow-sm">
    Authenticating...
  </div>

  <!-- Dark mode toggle -->
  <button id="themeToggle"
  class="mt-3 px-3 py-1 text-xs rounded-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-black text-gray-700 dark:text-gray-200">
  <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
</button>

</header>

<div class="max-w-4xl mx-auto">

  <!-- Auth Gate Overlay -->
  <div id="auth-gate" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-white dark:bg-[#0f0f0f] opacity-95"></div>
    <div class="relative z-10 h-full w-full flex items-center justify-center p-6">
      <div class="max-w-md w-full border border-gray-200 dark:border-gray-700 rounded-2xl bg-white dark:bg-black shadow-xl p-6 text-center">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Sign in required</h2>
        <p id="auth-gate-message" class="mt-2 text-sm text-gray-600 dark:text-gray-400">Please sign in with your Google account to continue.</p>
        <div class="mt-5 flex flex-col gap-3">
          <button id="googleSignInBtn" class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-black text-gray-800 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-900">
            <span>🔐</span>
            <span>Continue with Google</span>
          </button>
          <button id="signOutBtn" class="hidden text-xs text-gray-600 dark:text-gray-300 underline">Sign out</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Participant Button -->
  <div class="flex justify-end mb-4">
    <button id="openAddModal"
      class="bg-black dark:bg-white dark:text-black text-white px-4 py-2 rounded-lg hover:opacity-80 transition flex items-center gap-2">
      ➕ Add Participant
    </button>
  </div>

  <!-- Add Modal -->
  <div id="addModal"
       class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white dark:bg-[#0f0f0f] w-full max-w-md rounded-xl shadow-xl p-6 border border-gray-200 dark:border-gray-700">

      <h3 class="text-lg font-semibold dark:text-gray-100 mb-1">Add Participant</h3>
      <p class="text-gray-500 dark:text-gray-400 text-sm mb-5">Enter details</p>

      <form id="participant-form" class="space-y-4">
        <input id="name-input" type="text" placeholder="Name"
           class="w-full border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 text-sm bg-white dark:bg-black dark:text-white" required>

        <input id="handle-input" type="text" placeholder="LeetCode Handle"
           class="w-full border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 text-sm bg-white dark:bg-black dark:text-white" required>

        <p id="form-error" class="text-sm text-red-600 dark:text-red-400 hidden"></p>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="closeAddModal" class="text-gray-600 dark:text-gray-300 text-sm">Cancel</button>
          <button class="bg-black text-white dark:bg-white dark:text-black px-4 py-2 text-sm rounded-lg">
            Add
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal"
       class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white dark:bg-[#0f0f0f] w-full max-w-md rounded-xl shadow-xl p-6 border border-gray-200 dark:border-gray-700">

      <h3 class="text-lg font-semibold dark:text-gray-100 mb-1">Edit Participant</h3>
      <p class="text-gray-500 dark:text-gray-400 text-sm mb-5">Update details</p>

      <form id="edit-participant-form" class="space-y-4">
        <input id="edit-name-input" type="text" placeholder="Name"
           class="w-full border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 text-sm bg-white dark:bg-black dark:text-white" required>

        <input id="edit-handle-input" type="text" placeholder="LeetCode Handle"
           class="w-full border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 text-sm bg-white dark:bg-black dark:text-white" required>

        <p id="edit-form-error" class="text-sm text-red-600 dark:text-red-400 hidden"></p>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="closeEditModal" class="text-gray-600 dark:text-gray-300 text-sm">Cancel</button>
          <button class="bg-black text-white dark:bg-white dark:text-black px-4 py-2 text-sm rounded-lg">
            Update
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Participants -->
  <div class="flex justify-between items-center mb-2 mt-6">
    <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-200">Participants</h2>
    <span id="participant-count"
      class="text-xs px-2 py-1 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg">
    0</span>
  </div>

  <div id="participants-list" class="space-y-3"></div>
</div>

<!-- ================= FIREBASE + APP LOGIC ================== -->
<script type="module">

// ✅ Firebase config
window.__app_id = "my-dsa-series";
window.__firebase_config = JSON.stringify({
  apiKey: "AIzaSyBycjUTbfinX-rYAz30vXFMIY3BQS3iBQI",
  authDomain: "leetcodedashboard-fe04c.firebaseapp.com",
  projectId: "leetcodedashboard-fe04c",
  appId: "1:765406102827:web:c85c7e1fba31279633b16e"
});
const BACKEND_URL = "https://getleetcodeactivity-zfvkczajpq-uc.a.run.app";

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, query, onSnapshot, addDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const app = initializeApp(JSON.parse(window.__firebase_config));
const db = getFirestore(app);
const auth = getAuth(app);
const participantsPath = `/artifacts/${window.__app_id}/public/data/dsa_participants`;

const listEl = document.getElementById("participants-list");
const countEl = document.getElementById("participant-count");
const nameInput = document.getElementById("name-input");
const handleInput = document.getElementById("handle-input");
const formError = document.getElementById("form-error");
const editNameInput = document.getElementById("edit-name-input");
const editHandleInput = document.getElementById("edit-handle-input");
const editFormError = document.getElementById("edit-form-error");

// ✅ Modal actions
const addModal = document.getElementById("addModal");
const editModal = document.getElementById("editModal");
document.getElementById("openAddModal").onclick = ()=> addModal.classList.remove("hidden");
document.getElementById("closeAddModal").onclick = ()=> addModal.classList.add("hidden");
document.getElementById("closeEditModal").onclick = ()=> editModal.classList.add("hidden");

// Close modals when clicking outside
addModal.addEventListener("click", (e) => {
  if (e.target === addModal) addModal.classList.add("hidden");
});
editModal.addEventListener("click", (e) => {
  if (e.target === editModal) editModal.classList.add("hidden");
});

let currentEditId = null;

// ✅ Dark Mode
const themeBtn = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");
const themeText = document.getElementById("themeText");

function updateThemeButton(isDark) {
  if (isDark) {
    themeIcon.textContent = "☀️";
    themeText.textContent = "Light Mode";
  } else {
    themeIcon.textContent = "🌙";
    themeText.textContent = "Dark Mode";
  }
}

// Init theme based on saved preference or system
if (localStorage.theme === "dark" || 
    (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)
) {
  document.documentElement.classList.add("dark");
  updateThemeButton(true);
} else {
  document.documentElement.classList.remove("dark");
  updateThemeButton(false);
}

themeBtn.onclick = () => {
  const isDark = document.documentElement.classList.toggle("dark");
  localStorage.theme = isDark ? "dark" : "light";
  updateThemeButton(isDark);
};


// ✅ Auth (Google Sign-In with allowlist)
const ALLOWED_EMAILS = [
  // TODO: Replace with your allowed emails
  "himamshus06@gmail.com",
  "anujna27116k@gmail.com"
];

const authGateEl = document.getElementById("auth-gate");
const authGateMsgEl = document.getElementById("auth-gate-message");
const googleBtn = document.getElementById("googleSignInBtn");
const signOutBtn = document.getElementById("signOutBtn");

function showAuthGate(message) {
  if (message) authGateMsgEl.textContent = message;
  authGateEl.classList.remove("hidden");
}

function hideAuthGate() {
  authGateEl.classList.add("hidden");
}

googleBtn.onclick = async () => {
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
  } catch (e) {
    showAuthGate("Sign-in failed. Please try again.");
  }
};

signOutBtn.onclick = async () => {
  try { await signOut(auth); } catch {}
};

onAuthStateChanged(auth, (user)=>{
  if (!user) {
    document.getElementById("auth-info").textContent = "Not signed in";
    signOutBtn.classList.add("hidden");
    showAuthGate("Please sign in with your Google account to continue.");
    return;
  }

  const email = user.email || "";
  const allowed = email && ALLOWED_EMAILS.map(e=>e.toLowerCase()).includes(email.toLowerCase());

  if (!allowed) {
    document.getElementById("auth-info").textContent = email ? `Access denied for ${email}` : "Access denied";
    signOutBtn.classList.remove("hidden");
    showAuthGate("Your email is not allowed to access this page.");
    return;
  }

  hideAuthGate();
  signOutBtn.classList.remove("hidden");
  document.getElementById("auth-info").textContent = `Signed in: ${email}`;

  onSnapshot(query(collection(db, participantsPath)), snap=>{
    const arr = []; snap.forEach(d=>arr.push({id:d.id, ...d.data()}));
    arr.sort((a,b)=>a.name.localeCompare(b.name));
    render(arr);
  });
});

// ✅ Add Participant
document.getElementById("participant-form").addEventListener("submit", async e=>{
  e.preventDefault();
  formError.classList.add("hidden");
  try {
    await addDoc(collection(db, participantsPath), {
      name: nameInput.value.trim(),
      handle: handleInput.value.trim(),
    });
    addModal.classList.add("hidden");
    nameInput.value = ""; handleInput.value = "";
  } catch {
    formError.textContent = "Error adding participant!"; formError.classList.remove("hidden");
  }
});

// ✅ Edit Participant
document.getElementById("edit-participant-form").addEventListener("submit", async e=>{
  e.preventDefault();
  editFormError.classList.add("hidden");
  if (!currentEditId) return;
  try {
    await updateDoc(doc(db, participantsPath, currentEditId), {
      name: editNameInput.value.trim(),
      handle: editHandleInput.value.trim(),
    });
    editModal.classList.add("hidden");
    currentEditId = null;
    editNameInput.value = ""; editHandleInput.value = "";
  } catch {
    editFormError.textContent = "Error updating participant!"; editFormError.classList.remove("hidden");
  }
});

// ✅ Helper function to escape HTML attributes
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ✅ Open edit modal
window.openEditModal = (id) => {
  const participant = window.participantsMap?.get(id);
  if (!participant) return;
  currentEditId = id;
  editNameInput.value = participant.name;
  editHandleInput.value = participant.handle;
  editFormError.classList.add("hidden");
  editModal.classList.remove("hidden");
};

// ✅ Render Participants with accordion stats
function render(list){
  listEl.innerHTML = "";
  countEl.textContent = list.length;
  
  // Store participants in a map for easy access
  window.participantsMap = new Map();
  list.forEach(p => window.participantsMap.set(p.id, p));

  list.forEach(p=>{
    const wrapper = document.createElement("div");
    wrapper.className="border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-black overflow-hidden";

    const btn = document.createElement("button");
    btn.className="w-full flex justify-between px-4 py-3 text-left hover:bg-gray-50 dark:hover:bg-gray-900 transition";
    btn.innerHTML = `
      <div>
        <div class="font-medium dark:text-gray-100">${p.name}</div>
        <div class="text-xs text-gray-500 dark:text-gray-400">@${p.handle}</div>
      </div>
      <span class="arrow text-gray-500 dark:text-gray-400 text-lg">▼</span>
    `;

    const content = document.createElement("div");
    content.className = "hidden border-t border-gray-200 dark:border-gray-800 p-4 text-sm";
    content.innerHTML = "Loading...";

    wrapper.appendChild(btn);
    wrapper.appendChild(content);
    listEl.appendChild(wrapper);

    let loaded = false;

    btn.onclick = async ()=>{
      content.classList.toggle("hidden");
      btn.querySelector(".arrow").style.transform =
        content.classList.contains("hidden") ? "rotate(0deg)" : "rotate(180deg)";

      if(!loaded){
        try{
          const res = await fetch(`${BACKEND_URL}?handle=${p.handle}`);
          const data = await res.json();
          content.innerHTML = `
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs dark:text-gray-200 mb-4">
              <div><b>Total:</b> ${data.totalSolved}</div>
              <div><b>E/M/H:</b> ${data.difficultyBreakdown.easy}/${data.difficultyBreakdown.medium}/${data.difficultyBreakdown.hard}</div>
              <div><b>Rating:</b> ${data.contestRating}</div>
              <div><b>Recent:</b> ${data.recentSubmission.title}</div>
            </div>

            <div class="flex gap-2">
              <button class="text-blue-500 dark:text-blue-400 text-xs border border-blue-500 dark:border-blue-400 px-3 py-1 rounded hover:bg-blue-50 dark:hover:bg-blue-900/20 transition"
                onclick="openEditModal('${p.id}')">✏️ Edit</button>
              <button class="text-red-500 dark:text-red-400 text-xs border border-red-500 dark:border-red-400 px-3 py-1 rounded hover:bg-red-50 dark:hover:bg-red-900/20 transition"
                onclick="deleteParticipant('${p.id}')">🗑️ Delete</button>
            </div>
          `;
        }catch{
          content.innerHTML = `
            <div class="mb-4">
              <span class="text-yellow-600 dark:text-yellow-400 text-xs">⚠️ Could not fetch LeetCode data (handle may be invalid)</span>
            </div>
            <div class="flex gap-2">
              <button class="text-blue-500 dark:text-blue-400 text-xs border border-blue-500 dark:border-blue-400 px-3 py-1 rounded hover:bg-blue-50 dark:hover:bg-blue-900/20 transition"
                onclick="openEditModal('${p.id}')">✏️ Edit</button>
              <button class="text-red-500 dark:text-red-400 text-xs border border-red-500 dark:border-red-400 px-3 py-1 rounded hover:bg-red-50 dark:hover:bg-red-900/20 transition"
                onclick="deleteParticipant('${p.id}')">🗑️ Delete</button>
            </div>
          `;
        }
        loaded = true;
      }
    };
  });
}

// ✅ Delete function
window.deleteParticipant = async (id) => {
  const participant = window.participantsMap?.get(id);
  if (!participant) return;
  
  if (confirm(`Are you sure you want to delete "${participant.name}"? This action cannot be undone.`)) {
    try {
      await deleteDoc(doc(db, participantsPath, id));
    } catch (error) {
      alert("Error deleting participant. Please try again.");
    }
  }
};

</script>
</body>
</html>
